# ------------------------------
# Server
# ------------------------------
server.port=${PORT:8080}

# ------------------------------
# CORS (comma-separated list of frontend origins)
# ------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://react-jsp-gram.vercel.app}

# ------------------------------
# JWT (JWT_SECRET must be at least 32 characters)
# ------------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# ------------------------------
# Redis (OTP storage + feed cache)
# Use rediss://... for TLS providers
# ------------------------------
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=2s

app.otp.ttl-minutes=5
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60
# false = OTP is only written to the server log (local dev). true = email it.
app.otp.email-enabled=${OTP_EMAIL_ENABLED:false}

app.feed-cache.ttl-seconds=60


# ------------------------------
# Database - PostgreSQL
# ------------------------------
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ------------------------------
# JPA
# ------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.jakarta.persistence.validation.mode=none

# ------------------------------
# Spring Mail
# ------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ------------------------------
# File Upload
# ------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ------------------------------
# Cloudinary
# ------------------------------
cloudinary.url=${CLOUDINARY_URL}

# ------------------------------
# Razorpay
# ------------------------------
razorpay.key=${RAZORPAY_KEY}
razorpay.secret=${RAZORPAY_SECRET}
